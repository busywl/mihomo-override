name: Build Mihomo overrides

on:
  push:
    paths:
      - "config.yaml"
      - "generate.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pyyaml

      - name: Generate override files
        run: python generate.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mihomo-override/dist/openclash.conf mihomo-override/dist/clashmi.js
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "chore: build mihomo overrides"
          git push
