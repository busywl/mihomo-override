[YAML]

proxy-groups+:
- name: 🇭🇰 香港节点
  type: url-test
  include-all: true
  exclude-type: direct
  filter: (?i)香港|港|HK|Hong Kong|HongKong
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 0
  lazy: false
- name: 🇯🇵 日本节点
  type: url-test
  include-all: true
  exclude-type: direct
  filter: (?i)日本|日|JP|Japan|Tokyo|Osaka
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 0
  lazy: false
- name: 🇸🇬 新加坡节点
  type: url-test
  include-all: true
  exclude-type: direct
  filter: (?i)新加坡|狮城|SG|Singapore
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 0
  lazy: false
- name: 🇺🇸 美国节点
  type: url-test
  include-all: true
  exclude-type: direct
  filter: (?i)美国|美|US|USA|United States|Los Angeles|Seattle|San Jose
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 0
  lazy: false
- name: 🤖 AI
  type: select
  proxies:
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🇺🇸 美国节点
  - 🇭🇰 香港节点
  include-all: false
  exclude-type: direct
proxy-groups*:
  where:
    name: 良心云
  set:
    +proxies:
    - 🇭🇰 香港节点
    - 🇯🇵 日本节点
    - 🇸🇬 新加坡节点
    - 🇺🇸 美国节点
+rules:
- GEOSITE,category-ai-!cn,🤖 AI
