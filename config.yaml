# 唯一需要维护的源配置。不要在这里填写机场订阅链接或 token。

regions:
  hongkong:
    name: "🇭🇰 香港节点"
    filter: "(?i)香港|港|HK|Hong Kong|HongKong"
  japan:
    name: "🇯🇵 日本节点"
    filter: "(?i)日本|日|JP|Japan|Tokyo|Osaka"
  singapore:
    name: "🇸🇬 新加坡节点"
    filter: "(?i)新加坡|狮城|SG|Singapore"
  usa:
    name: "🇺🇸 美国节点"
    filter: "(?i)美国|美|US|USA|United States|Los Angeles|Seattle|San Jose"

url_test:
  url: "https://www.gstatic.com/generate_204"
  interval: 300
  tolerance: 0
  lazy: false

# 机场原订阅里的现有策略组名称；脚本会把四个地区组插到它的最前面。
main_group: "良心云"

ai:
  name: "🤖 AI"
  # 除下方的 AI 故障转移组外，保留原来的地区自动测速组作为快捷选项。
  regions:
    - japan
    - singapore
    - usa
    - hongkong
  # 在 🤖 AI 中同时列出机场所有原始节点，便于手动固定某个出口 IP。
  include_all_nodes: true
  # AI 专用故障转移：只会在对应地区的节点之间切换，不按延迟自动跳转。
  fallback_groups:
    - name: "🇯🇵 AI 日本故障转移"
      region: japan
      interval: 600
      max_failed_times: 2
